name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate JSON
        run: |
          node --input-type=commonjs -e "const fs=require('fs'); for (const file of ['palette.json','vscode/package.json','t3/stillwater.json','ryoku/scheme.json','ryoku/meta.json']) JSON.parse(fs.readFileSync(file,'utf8'));"
      - name: Rebuild CSS
        run: |
          npm run build
          git diff --exit-code stillwater.css
      - name: Installer tests
        run: bash tests/test_install.sh
      - name: Installer list
        run: bash install.sh --list
