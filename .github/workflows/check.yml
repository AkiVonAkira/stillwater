name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Builds the themes and runs install.sh against an empty home, creating each
  # app's folders so the installer finds it.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate JSON
        run: |
          node --input-type=commonjs -e "const fs=require('fs'); for (const file of ['palette.json','vscode/package.json','t3/stillwater.json','voltius/stillwater.json','ryoku/scheme.json','ryoku/meta.json']) JSON.parse(fs.readFileSync(file,'utf8'));"
      - name: Check versions
        run: npm run version:check
      - name: Rebuild CSS
        run: |
          npm run build
          git diff --exit-code stillwater.css
      - name: Installer tests
        run: bash tests/test_install.sh

  # Runs install.ps1, the path Windows users take, against an empty home.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer tests
        shell: pwsh
        run: ./tests/test_install.ps1
