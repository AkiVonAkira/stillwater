name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck theme generator
        run: npm run typecheck
      - name: Validate JSON
        run: |
          node --input-type=commonjs -e "const fs=require('fs'); for (const file of ['palette.json','vscode/package.json','t3/stillwater.json','voltius/stillwater.json','ryoku/scheme.json','ryoku/meta.json']) JSON.parse(fs.readFileSync(file,'utf8'));"
      - name: Check versions
        run: |
          node --input-type=commonjs <<'EOF'
          const fs = require("fs");
          const spec = JSON.parse(fs.readFileSync("palette.json", "utf8"));
          if (!spec.version) throw new Error("palette.json missing version");
          const vs = JSON.parse(fs.readFileSync("vscode/package.json", "utf8"));
          if (vs.version !== spec.version) throw new Error("vscode version mismatch");
          const zed = fs.readFileSync("zed/extension.toml", "utf8");
          if (!zed.includes("version = \"" + spec.version + "\"")) throw new Error("zed version mismatch");
          for (const base of ["base", "midnight", "comfy"]) {
            const ven = fs.readFileSync("vencord/" + base + "/Stillwater.theme.css", "utf8");
            if (!ven.includes("@version " + spec.version)) throw new Error("vencord " + base + " version mismatch");
          }
          const spice = fs.readFileSync("spicetify/color.ini", "utf8");
          if (!spice.includes("version " + spec.version)) throw new Error("spicetify version mismatch");
          const harbor = fs.readFileSync("harbor/Stillwater.harborstyle", "utf8");
          if (!harbor.includes("# version " + spec.version)) throw new Error("harbor version mismatch");
          const ff = fs.readFileSync("fastfetch/config.jsonc", "utf8");
          if (!ff.includes("@version " + spec.version)) throw new Error("fastfetch version mismatch");
          EOF
      - name: Rebuild CSS
        run: |
          npm run build
          git diff --exit-code stillwater.css
      - name: Installer tests
        run: bash tests/test_install.sh
      - name: Installer list
        run: bash install.sh --list
